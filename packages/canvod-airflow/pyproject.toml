[project]
name = "canvod-airflow"
version = "0.1.0"
description = "Airflow DAG definitions for canvodpy GNSS-T pipelines"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "Nicolas François Bader", email = "support@canvodpy.eu"},
]
maintainers = [
    {name = "Climate and Environmental Remote Sensing (CLIMERS)", email = "support@canvodpy.eu"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "GNSS",
    "GNSS-T",
    "Airflow",
    "workflow",
    "VOD",
    "remote sensing",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "structlog>=23.0",
    "canvodpy>=0.3.0",
    "apache-airflow>=3.3.2",
]

[project.urls]
Homepage = "https://github.com/TUW-GEO/canvodpy-extensions"
Documentation = "https://extensions.canvodpy.eu/packages/airflow/overview/"
Repository = "https://github.com/TUW-GEO/canvodpy-extensions"
Issues = "https://github.com/TUW-GEO/canvodpy-extensions/issues"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "canvod.airflow"
