[project]
name = "canvod-adapters"
version = "0.1.0"
description = "Bidirectional data adapters between canvodpy and third-party GNSS-VOD tools"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "Nicolas François Bader", email = "support@canvodpy.eu"},
]
maintainers = [
    {name = "Climate and Environmental Remote Sensing (CLIMERS)", email = "support@canvodpy.eu"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "GNSS",
    "GNSS-T",
    "VOD",
    "gnssvod",
    "data conversion",
    "remote sensing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "canvod-readers",
    "canvod-utils",
    "pydantic>=2.0",
    "xarray>=2024.1.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "h5netcdf>=1.3.0",
    "h5py>=3.10.0",
]

[project.optional-dependencies]
store = ["canvod-store>=0.2.3"]

[project.urls]
Homepage = "https://github.com/TUW-GEO/canvodpy-extensions"
Documentation = "https://extensions.canvodpy.eu/packages/adapters/overview/"
Repository = "https://github.com/TUW-GEO/canvodpy-extensions"
Issues = "https://github.com/TUW-GEO/canvodpy-extensions/issues"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "canvod.adapters"
