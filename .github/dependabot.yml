version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Releases at least a week old, as uv lock takes them (exclude-newer in
    # pyproject.toml; the canvodpy packages are exempt there too).
    # Named one by one: "canvod-*" would match the workspace packages too.
    cooldown:
      default-days: 7
      exclude:
        - "canvodpy"
        - "canvod-auxiliary"
        - "canvod-config"
        - "canvod-grids"
        - "canvod-ops"
        - "canvod-preflight"
        - "canvod-readers"
        - "canvod-store"
        - "canvod-store-metadata"
        - "canvod-utils"
        - "canvod-viz"
        - "canvod-vod"
    labels:
      - "dependencies"
      - "python"
    groups:
      python-deps:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
