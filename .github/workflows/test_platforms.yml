name: Platform Tests

on:
    workflow_call: # from ci.yml, its only trigger
        inputs:
            # The Ubuntu job uploads the coverage to Coveralls and writes
            # the coverage comment on the pull request.
            coverage:
                type: boolean
                default: false

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
    build:
        name: Tests • ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        permissions:
            contents: write # the coverage comment keeps its data on a branch
            pull-requests: write # the coverage comment
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      python-version: '3.14'
                      name: 'Python 3.14 - Ubuntu'
                    - os: windows-latest
                      python-version: '3.14'
                      name: 'Python 3.14 - Windows'
                    - os: macos-latest
                      python-version: '3.14'
                      name: 'Python 3.14 - macOS'

        defaults:
            run:
                shell: bash

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install uv and set the python version
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: true
            - name: Set up Python
              run: uv python install
            - name: Install the Project
              run: uv sync --locked --dev
            - name: Run Tests
              # pytest measures the coverage on every platform (addopts in
              # pyproject.toml); the Ubuntu job reports it.
              run: uv run pytest --verbose --color=yes
            - name: Upload to Coveralls
              if: inputs.coverage && matrix.os == 'ubuntu-latest'
              uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
              with:
                  file: coverage.lcov
            - name: Coverage comment
              if: inputs.coverage && matrix.os == 'ubuntu-latest'
              uses: py-cov-action/python-coverage-comment-action@2136b292bfcd2a9925b36a46960fcb6f7be8e7fe # v3
              with:
                  GITHUB_TOKEN: ${{ github.token }}
                  VERBOSE: false
